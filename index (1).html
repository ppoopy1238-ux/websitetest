<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171f;
        --text: #eef0f5;
        --muted: #9aa3b5;
        --accent: #6c9bff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    main { max-width: 28rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    button {
      font: inherit;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0.8rem 1.5rem;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #status { margin-top: 1rem; min-height: 1.5rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>classroommaxxing</h1>
    <p>Click the button to open it in a new about:blank tab.</p>
    <button id="open" type="button">Open</button>
    <div id="status" role="status"></div>
  </main>

  <script>
    var FILE = "classroommaxxing.html";

    document.getElementById("open").addEventListener("click", function () {
      var status = document.getElementById("status");
      var win = window.open("about:blank", "_blank");

      if (!win) {
        status.textContent = "The tab was blocked. Allow pop-ups for this site and try again.";
        return;
      }

      // about:blank has no base URL, so the iframe needs a full address.
      var url = new URL(FILE, window.location.href).href;

      win.document.title = "classroommaxxing";
      win.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;";

      var frame = win.document.createElement("iframe");
      frame.src = url;
      frame.setAttribute("allowfullscreen", "");
      frame.setAttribute("allow", "fullscreen; autoplay; gamepad");
      frame.style.cssText = "border:0;width:100%;height:100%;";
      win.document.body.appendChild(frame);

      status.textContent = "Opened in a new tab.";
    });
  </script>
</body>
</html>
