<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Site</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #2f6fed;
      --surface: #ffffff;
      --border: #dfe3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171f;
        --text: #eef0f5;
        --muted: #9aa3b5;
        --accent: #6c9bff;
        --surface: #1c2029;
        --border: #2d3340;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header, main, footer {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.5rem;
    }
    header { padding-top: 3rem; }
    h1 { font-size: 2.25rem; margin: 0 0 0.5rem; line-height: 1.2; }
    .lead { color: var(--muted); font-size: 1.125rem; margin: 0; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    h2 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 0.75rem; }
    button {
      font: inherit;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #message { margin-top: 0.75rem; min-height: 1.5rem; color: var(--muted); }
    footer { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Hello, world</h1>
    <p class="lead">This is a test page hosted with GitHub Pages.</p>
  </header>

  <main>
    <section>
      <h2>It works</h2>
      <p>If you can read this, your site is live. Edit <code>index.html</code> in your repo and commit to change what appears here.</p>
    </section>

    <section>
      <h2>Try the button</h2>
      <p>This confirms JavaScript runs on your page too.</p>
      <button id="btn" type="button">Click me</button>
      <div id="message" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <p>Made for testing.</p>
  </footer>

  <script>
    var count = 0;
    document.getElementById("btn").addEventListener("click", function () {
      count += 1;
      document.getElementById("message").textContent =
        "Clicked " + count + (count === 1 ? " time." : " times.");
    });
  </script>
</body>
</html>
